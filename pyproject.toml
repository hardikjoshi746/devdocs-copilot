[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "adrag"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    # Phase 0 — async HTTP + data fetching
    "httpx>=0.27",
    # Phase 1 — API layer
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    # Phase 2 — embeddings + vector store
    "openai>=1.30",
    "chromadb>=0.5",
    # Phase 3–5 — retrieval
    "rank-bm25>=0.2.2",
    "sentence-transformers>=3.0",
    # Multi-language chunking
    "tree-sitter>=0.23",
    "tree-sitter-python>=0.23",
    "tree-sitter-javascript>=0.23",
    "tree-sitter-typescript>=0.23",
    # Phase 6–8 — LLM + evaluation
    "anthropic>=0.28",
    # Phase 9 — monitoring (dev only, local)
    "arize-phoenix>=4.0",
    "opentelemetry-sdk>=1.24",
    # Phase 11–13 — AWS
    "boto3>=1.34",
    "aws-xray-sdk>=2.14",
    "tree-sitter-java>=0.23.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]   # pycodestyle, pyflakes, isort

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest-asyncio>=1.4.0",
]
