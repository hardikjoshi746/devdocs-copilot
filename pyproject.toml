[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "adrag"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    # API layer
    "httpx>=0.27",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    # Embeddings + vector store
    "openai>=1.30",
    "chromadb>=0.5",
    # Retrieval
    "rank-bm25>=0.2.2",
    "sentence-transformers==2.7.0",
    # LLM + evaluation
    "anthropic>=0.28",
    # Monitoring — OTLP exporter only (no Phoenix server)
    "opentelemetry-sdk>=1.28",
    "opentelemetry-api>=1.28",
    "opentelemetry-exporter-otlp-proto-http>=1.44.0",
    # Cache + transport
    "redis>=8.1.0",
    "mcp>=2.2.0",
    # Security — PII masking
    "presidio-analyzer>=2.2",
    "presidio-anonymizer>=2.2",
    # Auth
    "PyJWT>=2.8",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Heavy ingestion-only deps — install locally, not in the container
ingest = [
    "tree-sitter>=0.23",
    "tree-sitter-python>=0.23",
    "tree-sitter-javascript>=0.23",
    "tree-sitter-typescript>=0.23",
    "tree-sitter-java>=0.23.5",
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "boto3>=1.34",
    "aws-xray-sdk>=2.14",
]
# Dev observability — Phoenix UI + AWS SDK
dev = [
    "arize-phoenix>=4.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]   # pycodestyle, pyflakes, isort

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest-asyncio>=1.4.0",
]
