name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv pip install --system -e ".[ingest,dev]"

      - name: Run tests
        env:
          # Real keys are only needed for integration tests — unit tests mock all API calls.
          # Dummy values prevent SDK clients from raising at module import time.
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || 'sk-dummy-for-ci' }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY || 'sk-ant-dummy-for-ci' }}
          JWT_SIGNING_SECRET: test-secret-for-ci-only
          REDIS_URL: redis://localhost:6379
        # test_retrieval.py requires a live corpus (data/bm25_corpus.json, Chroma, real API keys)
        # built by running ingestion — skip it in CI, run locally after ingestion
        run: pytest --tb=short -q --ignore=tests/test_retrieval.py